[advisories]
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "RUSTSEC-2026-0543: chrono is unmaintained (no security flaw, no fixed version). Blocker: arrow 60 depends on chrono, so it stays in the tree even if exarrow-rs drops its direct use. Re-evaluate when arrow drops chrono or a chrono security advisory appears." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
]

[[licenses.exceptions]]
name = "aws-lc-sys"
allow = ["OpenSSL"]  # Inherited from OpenSSL fork history
