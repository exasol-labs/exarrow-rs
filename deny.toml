[advisories]
ignore = [
    # paste is unmaintained but not vulnerable. It's a transitive dependency from
    # parquet (Apache Arrow) - we can't control it. Track: https://github.com/apache/arrow-rs/issues
    { id = "RUSTSEC-2024-0436", reason = "Transitive dep from parquet, unmaintained but not vulnerable" },

    # CVE-2026-43868 / GHSA-2f9f-gq7v-9h6m — CWE-789, CVSS 5.3 Medium
    # Affects: thrift <0.23.0. Upstream fix: parquet 59.x drops the thrift dependency
    #          (apache/arrow-rs#9962); thrift 0.23.0 is not on crates.io.
    # Blocker: parquet 58.4.0 still requires thrift ^0.17, and parquet 59.x needs arrow 59,
    #          which the downstream users of exarrow-rs do not use yet.
    # Re-evaluate when: exarrow-rs and its downstream users move to arrow and parquet 59.
    { id = "GHSA-2f9f-gq7v-9h6m", reason = "Transitive dep via parquet 58.x, which requires thrift ^0.17; the fix is in parquet 59.x, which needs arrow 59; re-evaluate when exarrow-rs and its downstream users move to arrow and parquet 59" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
]

[[licenses.exceptions]]
name = "aws-lc-sys"
allow = ["OpenSSL"]  # Inherited from OpenSSL fork history
